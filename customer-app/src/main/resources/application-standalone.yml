selmag:
  services:
    catalogue:
      uri: http://localhost:8081
server:
  port: 8083
spring:
  application:
    name: selmag-customer-app # becomes service.name in Tempo; matches the Loki label
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/selmag
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/selmag
            user-name-attribute: preferred_username
        # Единственный registration: authorization_code + token relay — токен юзера
        # пересылается вниз по цепочке, поэтому client_credentials не нужен.
        registration:
          keycloak:
            client-id: customer-app
            client-secret: vKR4vMsL2JtUMh9dN7adffMqY4Qn109m
            authorization-grant-type: authorization_code
            scope:
              - openid
              - view_catalogue
management:
  tracing:
    sampling:
      probability: 1.0 # default 0.1 — sample everything locally
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4 has no default endpoint: without this property no exporter is created.
          # The /v1/traces path is required for transport http.
          endpoint: http://localhost:4318/v1/traces
          transport: http
  otlp:
    metrics:
      export:
        enabled: false # metrics stay in Prometheus / VictoriaMetrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'