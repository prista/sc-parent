selmag:
  services:
    catalogue:
      uri: http://localhost:8081
server:
  port: 8083
spring:
  application:
    name: selmag-customer-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/selmag
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/selmag
            user-name-attribute: preferred_username
        # Единственный registration: authorization_code + token relay — токен юзера
        # пересылается вниз по цепочке, поэтому client_credentials не нужен.
        registration:
          keycloak:
            client-id: customer-app
            client-secret: vKR4vMsL2JtUMh9dN7adffMqY4Qn109m
            authorization-grant-type: authorization_code
            scope:
              - openid
              - view_catalogue
  cloud:
    loadbalancer:
      enabled: false
    config:
      enabled: false # standalone profile - configuration comes from local files
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
  otlp:
    metrics:
      export:
        enabled: false # metrics stay in Prometheus / VictoriaMetrics
  health:
    config:
      enabled: false # config client is disabled in this profile
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  client:
    enabled: false
