name: selmag

# Полный стек: инфраструктура + 8 приложений.
# Перед сборкой образов нужны -exec JAR-ы: ./mvnw clean package -DskipTests
# Запуск: docker compose up -d --build
#
# Keycloak (issuer и админка): http://keycloak.localhost:8082 (админка /admin, admin/admin).
# keycloak.localhost резолвится браузером в 127.0.0.1 (RFC 6761: *.localhost),
# а внутри сети — через network alias на контейнер keycloak. Поэтому issuer один для всех:
# http://keycloak.localhost:8082/realms/selmag, без правок /etc/hosts и host.docker.internal.

x-build: &build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  LOKI: http://loki:3100
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"

services:
  # ---------------- Инфраструктура ----------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # issuer = единый URL, доступный и браузеру, и контейнерам
      KC_HOSTNAME: http://keycloak.localhost:8082
      # внутри контейнера слушаем тот же порт, что опубликован (8082:8082)
      KC_HTTP_PORT: "8082"
    volumes:
      - './config/keycloak/import:/opt/keycloak/data/import:ro'
    ports:
      - '8082:8082'
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 3s
      retries: 40

  tempo:
    image: grafana/tempo:3.1.1
    command: -config.file=/etc/tempo.yaml
    volumes:
      - './config/tempo/tempo.yaml:/etc/tempo.yaml:ro'
    ports:
      - '3200:3200' # query API (Grafana)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP /v1/traces

  loki:
    image: grafana/loki:3.6.20
    ports:
      - '3100:3100'

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - '3000:3000'
    volumes:
      # named volume, а не bind mount: не зависит от UID хоста (на macOS bind mount
      # потребовал бы запускать compose с UID=$(id -u))
      - 'grafana-data:/var/lib/grafana'
      # datasource'ы и дашборды из репозитория: provisioning при старте
      - './config/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './config/grafana/dashboards:/etc/grafana/dashboards:ro'

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command: -promscrape.config=/promscrape.yaml
    volumes:
      - './config/victoria-metrics/promscrape_docker_compose.yaml:/promscrape.yaml:ro'
    ports:
      - '8428:8428'
    depends_on:
      keycloak:
        condition: service_healthy

  catalogue-db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
      POSTGRES_DB: catalogue
    volumes:
      - 'catalogue-db-data:/var/lib/postgresql/data'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue"]
      interval: 5s
      timeout: 3s
      retries: 20

  manager-db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: manager
      POSTGRES_DB: manager
    volumes:
      - 'manager-db-data:/var/lib/postgresql/data'
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager"]
      interval: 5s
      timeout: 3s
      retries: 20

  feedback-db:
    image: mongo:8
    volumes:
      - 'feedback-db-data:/data/db'
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Конфигурация и discovery ----------------
  config-server:
    image: selmag/config-server:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: config-server/target/config-server-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: standalone,native
      SELMAG_CONFIG_SEARCH_LOCATIONS: file:///config/{application}/{profile}
    volumes:
      - './config/cloud-compose:/config:ro'
    ports:
      - '8888:8888'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30

  eureka-server:
    image: selmag/eureka-server:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: eureka-server/target/eureka-server-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      LOKI: http://loki:3100
    ports:
      - '8761:8761'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-server:
    image: selmag/admin-server:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: admin-server/target/admin-server-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      # cloudconfig-профиля у admin-server нет — standalone + issuer на keycloak.localhost
      SPRING_PROFILES_ACTIVE: standalone
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak.localhost:8082/realms/selmag
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak.localhost:8082/realms/selmag
    ports:
      - '8085:8085'
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------- Бизнес-сервисы (cloudconfig) ----------------
  catalogue-service:
    image: selmag/catalogue-service:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: catalogue-service/target/catalogue-service-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: cloudconfig
      SPRING_CLOUD_CONFIG_URI: http://config:config-password@config-server:8888
    ports:
      - '8081:8081' # нужен для Swagger UI; REST — через api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      catalogue-db:
        condition: service_healthy

  feedback-service:
    image: selmag/feedback-service:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: feedback-service/target/feedback-service-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: cloudconfig
      SPRING_CLOUD_CONFIG_URI: http://config:config-password@config-server:8888
    ports:
      - '8084:8084' # нужен для Swagger UI; REST — через api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      feedback-db:
        condition: service_healthy

  manager-app:
    image: selmag/manager-app:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: manager-app/target/manager-app-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: cloudconfig
      SPRING_CLOUD_CONFIG_URI: http://config:config-password@config-server:8888
    ports:
      - '8080:8080'
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      manager-db:
        condition: service_healthy

  customer-app:
    image: selmag/customer-app:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: customer-app/target/customer-app-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: cloudconfig
      SPRING_CLOUD_CONFIG_URI: http://config:config-password@config-server:8888
    ports:
      - '8083:8083'
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  api-gateway:
    image: selmag/api-gateway:${IMAGE_TAG:-26.1.1}
    build:
      <<: *build
      args:
        JAR_FILE: api-gateway/target/api-gateway-${PROJECT_VERSION:-0.0.1-SNAPSHOT}-exec.jar
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: cloudconfig
      SPRING_CLOUD_CONFIG_URI: http://config:config-password@config-server:8888
    ports:
      - '8086:8086'
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  catalogue-db-data:
  manager-db-data:
  feedback-db-data:
  grafana-data:
