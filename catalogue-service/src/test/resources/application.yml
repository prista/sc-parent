spring:
  datasource:
    url: jdbc:tc:postgresql:17.4-alpine:///selmag?TC_DAEMON=true
    username: selmag
    password: selmag
  cloud:
    loadbalancer:
      enabled: false
    config:
      enabled: false # tests must not contact Config Server
eureka:
  client:
    enabled: false
management:
  health:
    config:
      enabled: false # config client is disabled in tests
  tracing:
    export:
      enabled: false # tests must not try to export spans to a missing Tempo
  otlp:
    metrics:
      export:
        enabled: false # no OTLP metrics in tests
