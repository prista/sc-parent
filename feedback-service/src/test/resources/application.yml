spring:
  cloud:
    loadbalancer:
      enabled: false # tests run without Eureka and must not try to load-balance

# Tests never activate the cloud profile, so application-cloud.yml cannot switch the
# Eureka client off for them — it has to be done here, in the test resources.
eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      enabled: false # tests must not try to export spans to a missing Tempo
  otlp:
    metrics:
      export:
        enabled: false # no OTLP metrics in tests
