server:
  port: 8086
  forward-headers-strategy: framework
spring:
  application:
    name: selmag-api-gateway
  boot:
    admin:
      client:
        url: http://localhost:8085
        instance:
          name: api-gateway
          service-host-type: ip
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/selmag
      client:
        registration:
          keycloak:
            client-id: api-gateway-metrics-client
            client-secret: QXThewVNGgzp6nh1vN7fR6SXcfhMgk7O
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/selmag
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalogue-service-route
              uri: http://127.0.0.1:8081
              predicates:
                - Host=catalogue.api.sandbox.drm.com.127.0.0.1.nip.io:8086
            - id: feedback-service-route
              uri: http://127.0.0.1:8084
              predicates:
                - Host=feedback.api.sandbox.drm.com.127.0.0.1.nip.io:8086
  config:
    enabled: false
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*' # exposes /actuator/prometheus for VictoriaMetrics
eureka:
  client:
    enabled: false
spring.cloud.loadbalancer.enabled: false
