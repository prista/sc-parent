# На данном этапе config-server запускается с двумя профилями:
#   SPRING_PROFILES_ACTIVE=standalone,native
# standalone загружает этот файл, native включает файловый (native) EnvironmentRepository.
server:
  port: 8888
spring:
  application:
    name: selmag-config-server
  cloud:
    config:
      server:
        native:
          search-locations: file://${user.home}/prog/sel/sc-parent/config/cloud/{application}/{profile}