server:
  port: 8085
spring:
  security:
    oauth2:
      # это одноврменно и ресурс сервер (для регистрируемых клиентов админки)
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/selmag
      # и просто клиент, который коннектится к catalogue-service (ресурс серверу тоже)
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/selmag
        registration:
          keycloak:
            authorization-grant-type: client_credentials
            scope:
              - metrics
            client-id: admin-service
            client-secret: KXdsQtVJQ0vmY5TKY1VzVEPozgfQttV3
          login:
            provider: keycloak
            scope:
              - metrics
              - openid
            client-id: admin-service
            client-secret: KXdsQtVJQ0vmY5TKY1VzVEPozgfQttV3
management: # specify export metrics, which one should be exposed
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus