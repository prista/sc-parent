selmag:
  services:
    catalogue:
      uri: http://localhost:54321
spring:
  boot:
    admin:
      client:
        enabled: false
  datasource:
    url: jdbc:tc:postgresql:17.4-alpine:///manager?TC_DAEMON=true
    username: manager
    password: manager
  cloud:
    loadbalancer:
      enabled: false
    config:
      enabled: false # tests must not contact Config Server
eureka:
  client:
    enabled: false

management:
  health:
    config:
      enabled: false # config client is disabled in tests
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false