selmag:
  services:
    catalogue:
      uri: http://localhost:54321

spring:
  datasource:
    url: jdbc:tc:postgresql:17.4-alpine:///manager?TC_DAEMON=true
    username: manager
    password: manager
  cloud:
    loadbalancer:
      enabled: false # tests run without Eureka and must not try to load-balance

# Tests never activate the cloud profile, so application-cloud.yaml cannot switch the
# Eureka client off for them — it has to be done here, in the test resources.
eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      enabled: false # tests must not try to export spans to a missing Tempo
  otlp:
    metrics:
      export:
        enabled: false # no OTLP metrics in tests